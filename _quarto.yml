lang: en

project:
  type: website
  output-dir: _site
  resources:
    - images/**
  render:
    - index.qmd
    - about.qmd
    - research.qmd
    - publications.qmd
    - photos.qmd

website:
  title: "Eunji Kim"
  description: "Eunji Kim | Ph.D. Candidate at Ulsan National Institute of Science and Technology | Tropical cyclone rainfall and seasonal prediction"
  favicon: images/favicon.svg
  navbar:
    title: "Eunji Kim"
    pinned: true
    collapse: true
    collapse-below: lg
    background: "#F8F7F3"
    foreground: "#203B54"
    right:
      - text: Home
        href: index.qmd
      - text: About Me
        href: about.qmd
      - text: Research
        href: research.qmd
      - text: Publications
        href: publications.qmd
      - text: Photos
        href: photos.qmd
  page-footer:
    left: "© 2026 Eunji Kim"
    right: "Built with Quarto · Hosted on GitHub Pages"
    border: true
  open-graph: true

format:
  html:
    theme: cosmo
    css: site-theme-v9.css
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    html-math-method: katex

execute:
  freeze: auto
